title: Smartcon Watchparty 2023 Mumbai
date: 2023-10-08
collaborators:
  - Ganesh Tiwari
companies:
  - name: Chainlink
    url: https://chain.link
gist: >
  Smartcon Watchparty is an annual event that we host in Mumbai every year
  and in 2023 we hosted the second installment of it. I was a bit nervous
  trying to host this year's Smartcon Watchparty as I had not done an event
  in quite a long time and also I was constantly worried if people would
  actually show up. But it went pretty smooth.
